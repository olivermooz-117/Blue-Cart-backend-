name: Backend CI/CD Pipeline

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Check Python syntax
        run: |
          python -m compileall -q app.py config.py extensions.py models.py validation.py routes services migrations

      - name: Run tests with coverage
        run: |
          test -d tests || { echo "tests/ directory is missing"; exit 1; }
          test -n "$(find tests -type f -name 'test_*.py' -print -quit)" || { echo "No test files found"; exit 1; }
          python -m pytest tests/ --cov=app --cov=routes --cov=services --cov=models --cov=config --cov-report=xml -v

      - name: Upload test results (if they exist)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            coverage.xml
            htmlcov/
            .coverage
          retention-days: 7
        continue-on-error: true
